#cloud-config
hostname: ${server_name}

# Create users
users:
  - name: ${username}
    groups: sudo,docker
    shell: /bin/zsh
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    ssh_authorized_keys:
      - ${ssh_public_key}

timezone: Africa/Lusaka

# Swap file, with its fstab entry (skipped if the file already exists)
swap:
  filename: /swapfile
  size: 4G
  maxsize: 4G

# Update package lists
package_update: true
package_upgrade: true

# Install essential packages
packages:
  - apt-transport-https
  - bat
  - btop
  - build-essential
  - ca-certificates
  - curl
  - duf
  - eza
  - fd-find
  - fzf
  - git-delta
  - gnupg
  - htop
  - jq
  - just
  - kitty-terminfo
  - lsb-release
  - ncdu
  - net-tools
  - plocate
  - python3-full
  - python3-pip
  - rclone
  - ripgrep
  - software-properties-common
  - ufw
  - unattended-upgrades
  - vim-nox
  - zoxide
  - zsh

# Configure firewall (as backup to Hetzner firewall)
runcmd:
  # UFW setup
  - ufw allow 22/tcp comment 'SSH access'
  - ufw allow 80/tcp comment 'HTTP access'
  - ufw allow 443/tcp comment 'HTTPS access'
  - ufw --force enable

  # Install fail2ban for SSH protection (since we can't rely on IP restrictions)
  - apt-get install -y fail2ban
  - systemctl enable fail2ban
  - systemctl start fail2ban

  # Install ctop (https://github.com/bcicen/ctop)
  - |
    ARCH=$(dpkg --print-architecture)
    wget "https://github.com/bcicen/ctop/releases/download/v0.7.7/ctop-0.7.7-linux-$${ARCH}" -O /usr/local/bin/ctop
    chmod +x /usr/local/bin/ctop

  # SSH hardening (config is in write_files below)
  - systemctl restart ssh

  # Apply swap tuning now (systemd-sysctl only reads sysctl.d at boot)
  - sysctl -p /etc/sysctl.d/99-swap.conf

  # Install Starship prompt
  - curl -sS https://starship.rs/install.sh | sh -s -- --yes

  # Install ZSH plugins and create support directories
  - |
    mkdir -p /home/${username}/.zsh/cache /home/${username}/.zfunc
    git clone --depth=1 https://github.com/zsh-users/zsh-autosuggestions /home/${username}/.zsh/zsh-autosuggestions
    git clone --depth=1 https://github.com/zsh-users/zsh-syntax-highlighting.git /home/${username}/.zsh/zsh-syntax-highlighting
    chown -R ${username}:${username} /home/${username}/.zsh/ /home/${username}/.zfunc

  # Create symlinks for Ubuntu-renamed CLI tools
  - |
    ln -sf /usr/bin/batcat /usr/local/bin/bat
    ln -sf /usr/bin/fdfind /usr/local/bin/fd

  # Configure .zshrc
  - |
    cat > /home/${username}/.zshrc << 'EOL'
    # =============== Keybindings ===============
    bindkey -e
    bindkey '^[[1;5C' vi-forward-word
    bindkey '^[[1;5D' vi-backward-word
    bindkey '^[[H' beginning-of-line
    bindkey '^[[F' end-of-line

    # =============== Options ===============
    setopt autocd
    setopt extendedglob
    setopt interactivecomments
    setopt magicequalsubst
    setopt notify
    setopt numericglobsort
    setopt promptsubst
    setopt sharehistory

    # =============== History ===============
    HISTFILE=~/.zsh_history
    HISTSIZE=100000
    SAVEHIST=100000
    setopt extended_history
    setopt appendhistory
    setopt incappendhistory
    setopt histignorealldups
    setopt histignoredups
    setopt histignorespace
    setopt histreduceblanks

    history() {
      if [[ $# -eq 0 ]]; then
        builtin history -i 1
      else
        builtin history "$@"
      fi
    }

    # =============== Paths ===============
    export PATH="$HOME/bin:$HOME/.local/bin:$PATH"
    export PATH="$PATH:/usr/sbin"

    # =============== Terminal ===============
    export TERM="xterm-256color"

    # =============== Editor ===============
    export VISUAL=vim
    export EDITOR="$VISUAL"

    # =============== Completions ===============
    fpath=(~/.zfunc $fpath)
    zstyle ':completion:*' use-cache on
    zstyle ':completion:*' cache-path ~/.zsh/cache
    zstyle ':completion:*' matcher-list 'm:{a-z}={A-Za-z}'
    autoload -Uz compinit
    for dump in ~/.zcompdump(N.mh+24); do
      compinit
    done
    compinit -C

    # =============== Aliases ===============
    alias ls='eza --icons'
    alias ll='eza -la --icons --git'
    alias la='eza -lah --icons --git'
    alias cat='bat'
    alias find='fd'
    alias grep='rg'
    alias du='duf'
    alias top='btop'
    alias cd='z'
    alias ts='date +"%Y-%m-%d-%H-%M-%S"'
    alias pipup='pip install --upgrade pip'

    # Safety aliases
    alias rm='rm -i'
    alias cp='cp -i'
    alias mv='mv -i'

    # Git helper functions
    function git_current_branch() {
      git symbolic-ref --short -q HEAD
    }

    function git_main_branch() {
      command git rev-parse --git-dir &>/dev/null || return
      local ref
      for ref in refs/{heads,remotes/{origin,upstream}}/{main,trunk,mainline,default,stable,master}; do
        if command git show-ref -q --verify $ref; then
          echo $${ref:t}
          return 0
        fi
      done
      echo master
    }

    # Git aliases
    alias g='git'
    alias gst='git status'
    alias gss='git status --short'
    alias ga='git add'
    alias gaa='git add --all'
    alias gc='git commit --verbose'
    alias gcmsg='git commit --message'
    alias gca='git commit --verbose --all'
    alias gc!='git commit --verbose --amend'
    alias gb='git branch'
    alias gba='git branch --all'
    alias gco='git checkout'
    alias gcb='git checkout -b'
    alias gcm='git checkout $(git_main_branch)'
    alias gd='git diff'
    alias gds='git diff --staged'
    alias gl='git pull'
    alias gp='git push'
    alias glog='git log --oneline --decorate --graph'
    alias glol='git log --graph --pretty="%Cred%h%Creset -%C(auto)%d%Creset %s %Cgreen(%ar) %C(bold blue)<%an>%Creset"'

    function ggp() {
      if [[ "$#" != 0 ]] && [[ "$#" != 1 ]]; then
        git push origin "$${*}"
      else
        [[ "$#" == 0 ]] && local b="$(git_current_branch)"
        git push origin "$${b:=$1}"
      fi
    }
    compdef _git ggp=git-checkout

    # Docker aliases
    alias dco="docker compose"
    alias dps='docker ps'
    alias dpsa='docker ps -a'
    alias dcu='docker compose up'
    alias dcud='docker compose up -d'
    alias dcd='docker compose down'

    # =============== Custom Functions ===============
    mkcd() { mkdir -p "$1" && cd "$1"; }

    extract() {
      if [ -f "$1" ]; then
        case "$1" in
          *.tar.bz2)   tar xjf "$1"     ;;
          *.tar.gz)    tar xzf "$1"     ;;
          *.bz2)       bunzip2 "$1"     ;;
          *.rar)       unrar e "$1"     ;;
          *.gz)        gunzip "$1"      ;;
          *.tar)       tar xf "$1"      ;;
          *.tbz2)      tar xjf "$1"     ;;
          *.tgz)       tar xzf "$1"     ;;
          *.zip)       unzip "$1"       ;;
          *.Z)         uncompress "$1"  ;;
          *.7z)        7z x "$1"        ;;
          *)           echo "'$1' cannot be extracted via extract()" ;;
        esac
      else
        echo "'$1' is not a valid file"
      fi
    }

    tar_max() {
      tar --exclude='.DS_Store' --exclude='node_modules' --exclude='__pycache__' -cv "$1" | xz -3e > "$2".tar.xz
    }

    grep_this() {
      command grep --color -inrw . -e "$1"
      echo "Matches: $(command grep -inrw . -e "$1" | wc -l)"
    }

    mkdir_date() {
      mkdir -p $(date '+%Y-%h-%d-%a')
    }

    kill_spaces() {
      command find . -name "*.$1" -type f -print0 | while IFS= read -r -d $'\0' f; do mv -v "$f" "$${f// /_}"; done
    }

    rgf() {
      rg --color=always --line-number "$@" \
        | fzf --ansi --delimiter=: \
              --preview 'bat --color=always {1} --highlight-line {2}' \
              --preview-window 'right:60%:+{2}-3'
    }

    diff() {
      command diff --color=always "$@" | delta
    }

    # =============== FZF ===============
    if [ -f ~/.fzf.zsh ]; then
      source ~/.fzf.zsh
    elif [ -f /usr/share/doc/fzf/examples/key-bindings.zsh ]; then
      source /usr/share/doc/fzf/examples/key-bindings.zsh
    fi
    export FZF_DEFAULT_COMMAND='fd --type f --hidden --follow --exclude .git'
    export FZF_CTRL_T_COMMAND="$FZF_DEFAULT_COMMAND"
    export FZF_ALT_C_COMMAND='fd --type d --hidden --follow --exclude .git'
    export FZF_DEFAULT_OPTS='--height 40% --layout=reverse --border --info=inline'

    # =============== Starship ===============
    eval "$(starship init zsh)"

    # =============== Syntax highlighting & autosuggestions ===============
    [ -f "$HOME/.zsh/zsh-syntax-highlighting/zsh-syntax-highlighting.zsh" ] && source "$HOME/.zsh/zsh-syntax-highlighting/zsh-syntax-highlighting.zsh"
    [ -f "$HOME/.zsh/zsh-autosuggestions/zsh-autosuggestions.zsh" ] && source "$HOME/.zsh/zsh-autosuggestions/zsh-autosuggestions.zsh"

    # =============== Local / Secret Config ===============
    [ -f "$HOME/.zshrc.local" ] && source "$HOME/.zshrc.local"

    # =============== Zoxide ===============
    eval "$(zoxide init zsh)"
    EOL
    chown ${username}:${username} /home/${username}/.zshrc

  # Configure Starship
  - |
    mkdir -p /home/${username}/.config
    cat > /home/${username}/.config/starship.toml << 'EOL'
    # Refined "True Stock" Starship Configuration
    # (Matches default behavior exactly, but with Catppuccin colors and Nerd Font icons)

    "$schema" = 'https://starship.rs/config-schema.json'

    palette = 'catppuccin_mocha'
    format = "$all"
    add_newline = true

    [directory]
    style = "bold blue"
    format = "[$path]($style) "
    truncation_length = 3
    truncation_symbol = "…/"

    [git_branch]
    symbol = " "
    style = "bold mauve"
    format = "on [$symbol$branch]($style) "

    [git_status]
    style = "bold red"
    format = '([\[$all_status$ahead_behind\]]($style) )'

    [nodejs]
    symbol = " "
    style = "bold green"
    format = "via [$symbol($version )]($style)"

    [rust]
    symbol = " "
    style = "bold red"
    format = "via [$symbol($version )]($style)"

    [python]
    symbol = " "
    style = "bold yellow"
    format = 'via [$symbol($version )(\($virtualenv\) )]($style)'

    [golang]
    symbol = " "
    style = "bold sky"
    format = "via [$symbol($version )]($style)"

    [php]
    symbol = " "
    style = "bold blue"
    format = "via [$symbol($version )]($style)"

    [java]
    symbol = " "
    style = "bold red"
    format = "via [$symbol($version )]($style)"

    [docker_context]
    symbol = " "
    style = "bold blue"
    format = "via [$symbol$context]($style) "

    [cmd_duration]
    min_time = 500
    show_milliseconds = false
    style = "bold yellow"
    format = "took [$duration]($style) "

    [character]
    success_symbol = "[❯](bold green)"
    error_symbol = "[✖](bold red)"
    vimcmd_symbol = "[❮](bold green)"

    [time]
    disabled = true
    time_format = "%R"
    style = "bold subtext0"
    format = "at [$time]($style) "

    [palettes.catppuccin_mocha]
    rosewater = "#f5e0dc"
    flamingo = "#f2cdcd"
    pink = "#f5c2e7"
    mauve = "#cba6f7"
    red = "#f38ba8"
    maroon = "#eba0ac"
    peach = "#fab387"
    yellow = "#f9e2af"
    green = "#a6e3a1"
    teal = "#94e2d5"
    sky = "#89dceb"
    sapphire = "#74c7ec"
    blue = "#89b4fa"
    lavender = "#b4befe"
    text = "#cdd6f4"
    subtext1 = "#bac2de"
    subtext0 = "#a6adc8"
    overlay2 = "#9399b2"
    overlay1 = "#7f849c"
    overlay0 = "#6c7086"
    surface2 = "#585b70"
    surface1 = "#45475a"
    surface0 = "#313244"
    base = "#1e1e2e"
    mantle = "#181825"
    crust = "#11111b"
    EOL
    chown -R ${username}:${username} /home/${username}/.config/

  # Configure vim
  - |
    mkdir -p /home/${username}/.vim/autoload

    curl -fLo /home/${username}/.vim/autoload/plug.vim --create-dirs \
      https://raw.githubusercontent.com/junegunn/vim-plug/master/plug.vim

    cat > /home/${username}/.vimrc << 'EOL'
    set nocompatible
    filetype off

    call plug#begin('~/.vim/plugged')

    Plug 'preservim/nerdtree'
    Plug 'junegunn/fzf'
    Plug 'junegunn/fzf.vim'
    Plug 'vim-airline/vim-airline'
    Plug 'vim-airline/vim-airline-themes'
    Plug 'tpope/vim-fugitive'
    Plug 'airblade/vim-gitgutter'
    Plug 'sheerun/vim-polyglot'
    Plug 'catppuccin/vim', { 'as': 'catppuccin' }
    Plug 'tpope/vim-surround'
    Plug 'tpope/vim-commentary'
    Plug 'jiangmiao/auto-pairs'
    call plug#end()

    filetype plugin indent on
    syntax enable

    if has('termguicolors')
      set termguicolors
    endif

    try
        set background=dark
        colorscheme catppuccin_mocha
        let g:airline_theme='catppuccin_mocha'
    catch /^Vim\%((\a\+)\)\=:E185/
        colorscheme default
        let g:airline_theme='dark'
    endtry

    set number
    set relativenumber
    set cursorline
    set showmatch
    set incsearch
    set hlsearch
    set ignorecase
    set smartcase
    set autoindent
    set smartindent
    set tabstop=4
    set softtabstop=4
    set shiftwidth=4
    set expandtab
    set scrolloff=8
    set sidescrolloff=8
    set wrap
    set linebreak
    set mouse=a
    set backspace=indent,eol,start
    set wildmenu
    set wildmode=longest:full,full
    set splitbelow
    set splitright
    set laststatus=2
    set encoding=utf-8
    set nobackup
    set nowritebackup
    set noswapfile

    let mapleader = " "

    nnoremap <leader>ff :Files<CR>
    nnoremap <leader>fg :Rg<CR>
    nnoremap <leader>fb :Buffers<CR>

    let g:NERDTreeShowHidden=1
    let g:airline_powerline_fonts = 1
    let g:airline#extensions#tabline#enabled = 1

    autocmd BufEnter * if (winnr("$") == 1 && exists("b:NERDTree") && b:NERDTree.isTabTree()) | q | endif
    EOL

    chown -R ${username}:${username} /home/${username}/.vim
    chown ${username}:${username} /home/${username}/.vimrc

    su - ${username} -c 'vim -E -s -u "/home/${username}/.vimrc" +PlugInstall +qall'

write_files:
  # SSH hardening. sshd keeps the first value it reads, and sshd_config includes
  # sshd_config.d/*.conf at the top, so a 00- drop-in wins over everything else.
  - path: /etc/ssh/sshd_config.d/00-hardening.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
      AllowUsers ${username}

  - path: /etc/sysctl.d/99-swap.conf
    content: |
      vm.swappiness=10
      vm.vfs_cache_pressure=50

  # Configure unattended upgrades
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

# Final message on console
final_message: "The system is finally up, after $UPTIME seconds"
