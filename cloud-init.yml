#cloud-config

# Create users
users:
  - name: ${username}
    groups: sudo,docker
    shell: /bin/zsh
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    ssh_authorized_keys:
      - ${ssh_public_key}

timezone: Africa/Lusaka

# Swap file, with its fstab entry (skipped if the file already exists)
swap:
  filename: /swapfile
  size: 4G
  maxsize: 4G

# Update package lists
package_update: true
package_upgrade: true

# Install essential packages
packages:
  - bat
  - btop
  - build-essential
  - ca-certificates
  - curl
  - duf
  - eza
  - fail2ban
  - fd-find
  - fzf
  - git-delta
  - gnupg
  - jq
  - just
  - kitty-terminfo
  - ncdu
  - plocate
  - python3-full
  - python3-pip
  - rclone
  - ripgrep
  - ufw
  - unattended-upgrades
  - vim-nox
  - zoxide
  - zsh

runcmd:
  # UFW protects SSH and anything else running directly on the server, and still
  # holds if the Hetzner firewall is ever detached. Docker-published ports bypass
  # UFW, so only the Hetzner firewall (main.tf) covers containers.
  - ufw allow 22/tcp comment 'SSH access'
  - ufw allow 80/tcp comment 'HTTP access'
  - ufw allow 443/tcp comment 'HTTPS access'
  - ufw --force enable

  # SSH hardening (config is in write_files below)
  - systemctl restart ssh

  # Apply swap tuning now (systemd-sysctl only reads sysctl.d at boot)
  - sysctl -p /etc/sysctl.d/99-swap.conf

  # Install Starship prompt (download first, so a failed fetch isn't piped into sh)
  - curl -fsSL https://starship.rs/install.sh -o /tmp/starship-install.sh
  - sh /tmp/starship-install.sh --yes

  # Create symlinks for Ubuntu-renamed CLI tools
  - |
    ln -sf /usr/bin/batcat /usr/local/bin/bat
    ln -sf /usr/bin/fdfind /usr/local/bin/fd

  # Dotfiles live in dotfiles/ in this repo. install.sh links them and fetches their plugins.
  # To update them later: git -C ~/.provisioner pull
  - su - ${username} -c 'git clone --depth=1 https://github.com/engineervix/provisioner.git ~/.provisioner && ~/.provisioner/dotfiles/install.sh'

write_files:
  # SSH hardening. sshd keeps the first value it reads, and sshd_config includes
  # sshd_config.d/*.conf at the top, so a 00- drop-in wins over everything else.
  - path: /etc/ssh/sshd_config.d/00-hardening.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
      AllowUsers ${username}

  - path: /etc/sysctl.d/99-swap.conf
    content: |
      vm.swappiness=10
      vm.vfs_cache_pressure=50

  # Configure unattended upgrades
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
