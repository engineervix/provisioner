#cloud-config

# Create users
users:
  - name: ${username}
    groups: sudo,docker
    shell: /bin/zsh
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    ssh_authorized_keys:
      - ${ssh_public_key}

timezone: Africa/Lusaka

# Swap file, with its fstab entry (skipped if the file already exists)
swap:
  filename: /swapfile
  size: 4G
  maxsize: 4G

# Update package lists
package_update: true
package_upgrade: true

# Install essential packages
packages:
  - bat
  - btop
  - build-essential
  - ca-certificates
  - cron
  - curl
  - duf
  - eza
  - fail2ban
  - fd-find
  - fzf
  - git-delta
  - gnupg
  - jq
  - just
  - kitty-terminfo
  - ncdu
  - plocate
  - python3-full
  - python3-pip
  - rclone
  - ripgrep
  - ufw
  - unattended-upgrades
  - vim-nox
  - zoxide
  - zsh

runcmd:
  # cloud-init joins these items into one /bin/sh script: stop at the first
  # failure and log every command to /var/log/cloud-init-output.log
  - set -eux

  # UFW protects SSH and anything else running directly on the server, and still
  # holds if the Hetzner firewall is ever detached. Docker-published ports bypass
  # UFW, so only the Hetzner firewall (main.tf) covers containers.
  - ufw allow 22/tcp comment 'SSH access'
  - ufw allow 80/tcp comment 'HTTP access'
  - ufw allow 443/tcp comment 'HTTPS access'
  - ufw --force enable

  # SSH hardening (config is in write_files below)
  - systemctl restart ssh

  # Apply swap tuning now (systemd-sysctl only reads sysctl.d at boot)
  - sysctl -p /etc/sysctl.d/99-swap.conf

  # Install starship and lazydocker. The same script then runs daily from cron
  # to keep them up to date (see write_files). Its output: /var/log/update-tools.log
  - /etc/cron.daily/update-tools

  # Create symlinks for Ubuntu-renamed CLI tools
  - |
    ln -sf /usr/bin/batcat /usr/local/bin/bat
    ln -sf /usr/bin/fdfind /usr/local/bin/fd

  # Dotfiles live in dotfiles/ in this repo. install.sh links them and fetches their plugins.
  # To update them later: git -C ~/.provisioner pull
  - su - ${username} -c 'git clone --depth=1 https://github.com/engineervix/provisioner.git ~/.provisioner && ~/.provisioner/dotfiles/install.sh'

write_files:
  # SSH hardening. sshd keeps the first value it reads, and sshd_config includes
  # sshd_config.d/*.conf at the top, so a 00- drop-in wins over everything else.
  - path: /etc/ssh/sshd_config.d/00-hardening.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
      AllowUsers ${username}

  - path: /etc/sysctl.d/99-swap.conf
    content: |
      vm.swappiness=10
      vm.vfs_cache_pressure=50

  # Installs or updates the tools apt doesn't provide. Runs daily as root.
  # Each tool is reinstalled only when it's behind its latest GitHub release.
  # To add a tool, copy one of the blocks. Output of the last run: /var/log/update-tools.log
  - path: /etc/cron.daily/update-tools
    permissions: "0755"
    content: |
      #!/bin/sh
      set -eu
      exec >/var/log/update-tools.log 2>&1
      date

      tmp=$(mktemp -d)
      trap 'rm -rf "$tmp"' EXIT
      cd "$tmp"

      # Latest release of a GitHub repo: /releases/latest redirects to /releases/tag/vX.Y.Z
      latest() {
        v=$(curl -fsSLI -o /dev/null -w '%%{url_effective}' "https://github.com/$1/releases/latest") ||
          { echo "cannot check releases for $1" >&2; return 1; }
        v=$${v##*/v}
        case $v in [0-9]*) echo "$v" ;; *) echo "unexpected latest version for $1: $v" >&2; return 1 ;; esac
      }

      # lazydocker: release tarball, checked against the release's checksums
      v=$(latest jesseduffield/lazydocker)
      if [ "$(lazydocker --version 2>/dev/null | sed -n 's/^Version: //p')" = "$v" ]; then
        echo "lazydocker $v is up to date"
      else
        url=https://github.com/jesseduffield/lazydocker/releases/download/v$v
        curl -fsSL --remote-name-all "$url/lazydocker_$${v}_Linux_x86_64.tar.gz" "$url/checksums.txt"
        sha256sum -c --ignore-missing checksums.txt
        tar xzf "lazydocker_$${v}_Linux_x86_64.tar.gz" lazydocker
        install -m 755 lazydocker /usr/local/bin/
        echo "lazydocker updated to $v"
      fi

      # starship: its own installer, which puts it in /usr/local/bin
      v=$(latest starship/starship)
      if [ "$(starship --version 2>/dev/null | sed -n '1s/^starship //p')" = "$v" ]; then
        echo "starship $v is up to date"
      else
        curl -fsSL https://starship.rs/install.sh -o starship-install.sh
        sh starship-install.sh --yes
        echo "starship updated to $v"
      fi

  # Configure unattended upgrades
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
